<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F7F7F4" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>3D-атлас человека</title>
    <meta name="description" content="Бесплатный открытый 3D-атлас для базового изучения анатомии человека: наглядные модели органов и систем с понятными объяснениями — для преподавателей, взрослых и детей." />
    <meta property="og:title" content="3D-атлас человека" />
    <meta property="og:description" content="Бесплатный открытый 3D-атлас для базового изучения анатомии человека: наглядные модели органов и систем с понятными объяснениями — для преподавателей, взрослых и детей." />
    <meta property="og:type" content="website" />
    <!--
      Тема ставится до первой отрисовки: иначе тёмная страница пару секунд мигает белым, пока грузится приложение.
      Ключ и цвета — те же, что в src/lib/theme.tsx и src/styles/index.css.
    -->
    <script>
      (function () {
        var t = null;
        try {
          t = localStorage.getItem('atlas.theme');
        } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', t === 'dark' ? '#101114' : '#F5F5F1');
      })();
    </script>
    <style>
      html { background: #f5f5f1; color: #17203a; }
      html[data-theme='dark'] { background: #101114; color: #f0eee9; color-scheme: dark; }
      body { margin: 0; }
      /* текст для поисковиков (см. scripts/prerender-meta.ts) не мелькает неоформленным, пока грузится приложение */
      #root > .prerender {
        position: absolute; width: 1px; height: 1px; overflow: hidden;
        clip-path: inset(50%); white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
